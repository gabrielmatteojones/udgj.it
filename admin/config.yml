backend:
  name: git-gateway
  branch: main # ramo principale del repository

media_folder: "assets/uploads" # dove salvare i file caricati
public_folder: "/assets/uploads"

# Impostazioni globali
site_url: "https://tuo-sito.netlify.app"
display_url: "https://tuo-sito.netlify.app"
logo_url: "/assets/logo.png"

collections:
  # Gestione file _config.yml
  - name: "settings"
    label: "Impostazioni Sito"
    files:
      - label: "Configurazione Generale"
        name: "config"
        file: "_config.yml"
        fields:
          - { label: "Titolo", name: "title", widget: "string" }
          - { label: "Descrizione", name: "description", widget: "string" }
          - { label: "URL", name: "url", widget: "string" }
          - { label: "Base URL", name: "baseurl", widget: "string", required: false }
          - label: "Autore"
            name: "author"
            widget: "object"
            fields:
              - { label: "Nome", name: "name", widget: "string" }
              - { label: "Email", name: "email", widget: "string" }

  # Pagine statiche
  - name: "pages"
    label: "Pagine"
    folder: "_pages"
    create: true
    slug: "{{slug}}"
    extension: "md"
    fields:
      - { label: "Titolo", name: "title", widget: "string" }
      - { label: "Data", name: "date", widget: "datetime" }
      - { label: "Corpo", name: "body", widget: "markdown" }

  # Post del blog
  - name: "posts"
    label: "Articoli"
    folder: "_posts"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    extension: "md"
    fields:
      - { label: "Titolo", name: "title", widget: "string" }
      - { label: "Data", name: "date", widget: "datetime" }
      - { label: "Categoria", name: "categories", widget: "list" }
      - { label: "Tags", name: "tags", widget: "list", required: false }
      - { label: "Corpo", name: "body", widget: "markdown" }

  # Documenti
  - name: "docs"
    label: "Documenti"
    folder: "_docs"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Titolo", name: "title", widget: "string" }
      - { label: "Descrizione", name: "description", widget: "text" }
      - { label: "File PDF", name: "file", widget: "file" }
      - { label: "Data", name: "date", widget: "datetime" }
      - { label: "Corpo", name: "body", widget: "markdown", required: false }
